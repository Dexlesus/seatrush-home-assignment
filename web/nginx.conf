server {
  listen 8080;
  root /usr/share/nginx/html;

  # The browser talks to ONE origin (localhost:5173); nginx forwards API calls
  # to the api container. No CORS needed.
  location /api/ {
    proxy_pass http://api:3000;
    # If the api container is down, answer (504) after 3 s instead of ~40 s,
    # so the screen says "We can't reach the server" quickly. A running API
    # on the same Docker network connects in milliseconds.
    proxy_connect_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /docs {
    proxy_pass http://api:3000;
  }

  # Built files have a hash in their name, so they can be cached for long.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: every other path is index.html (React Router handles it).
  location / {
    try_files $uri /index.html;
  }
}
