# SeatRush: one command, `docker compose up --build`, starts everything:
#   db  → PostgreSQL 17
#   api → http://localhost:3000   (docs: http://localhost:3000/docs)
#   web → http://localhost:5173
#
# Every ${VAR:-default} has a default value, so it works on a fresh clone
# without creating a .env file (the brief: "no manual steps").
# A .env file next to this one, if it exists, overrides the defaults.

name: seatrush

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-seatrush}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seatrush}
      POSTGRES_DB: ${DB_NAME:-seatrush}
    ports:
      # "host:container". On your machine it's port 55432, not the usual 5432
      # (or 5433), so it doesn't clash with a PostgreSQL that is already
      # installed or running for another project.
      - "${DB_PORT:-55432}:5432"
    volumes:
      # Keeps the data when the container is recreated.
      # `docker compose down -v` deletes it for a clean start.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "Healthy" only when PostgreSQL accepts connections, not just when the
      # container has started. `$$` means: compose must not replace this; the
      # shell inside the container reads its own variable.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      # Inside the compose network the database is "db" on its normal port.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-seatrush}
      DB_PASSWORD: ${DB_PASSWORD:-seatrush}
      DB_NAME: ${DB_NAME:-seatrush}
      # The two business settings the reviewers change (they test a short hold).
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-300}
      MAX_SEATS_PER_USER: ${MAX_SEATS_PER_USER:-4}
      NO_LONE_SEATS: ${NO_LONE_SEATS:-false}
      PORT: 3000
      SEED_DEMO_EVENT: ${SEED_DEMO_EVENT:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy # wait until PostgreSQL accepts connections
    healthcheck:
      # Healthy = the API answers AND reaches the database (GET /api/health).
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build: ./web
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy # open the site only once the API works

volumes:
  pgdata:
